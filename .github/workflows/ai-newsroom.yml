name: C. O. Eric AI Newsroom

# Verified newsroom + automatic Video Hub pipeline.
# Manual build trigger: 2026-09-21
on:
  push:
    paths:
      # Root-level website pages/assets that should trigger the pipeline when edited.
      # Broad root patterns do not match generated files inside news/, videos/ or newsroom-data/.
      - '*.html'
      - '*.css'
      - '*.js'
      - '*.xml'
      - '*.json'
      # Newsroom/video source and generator code.
      - 'scripts/ai_newsroom.py'
      - 'scripts/run_ai_newsroom.py'
      - 'scripts/expand_existing_news.py'
      - 'scripts/generate_news_images.py'
      - 'scripts/repair_news_images.py'
      - 'scripts/update_video_hub.py'
      - 'video_sources.json'
      - '.github/workflows/ai-newsroom.yml'
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  newsroom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run newsroom
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/run_ai_newsroom.py
      - name: Expand existing short news articles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/expand_existing_news.py
      - name: Generate missing story images with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_news_images.py
      - name: Repair full article image paths
        run: python scripts/repair_news_images.py
      - name: Upgrade news SEO metadata
        run: python scripts/upgrade_news_seo.py
      - name: Update automatic Video Hub
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/update_video_hub.py
      - name: Show newsroom and video diagnostics
        if: always()
        run: |
          echo '=== NEWSROOM DIAGNOSTICS ==='
          if [ -f newsroom-data/run-report.json ]; then cat newsroom-data/run-report.json; else echo 'No run-report.json was generated.'; fi
          echo '=== IMAGE DIAGNOSTICS ==='
          if [ -f newsroom-data/image-report.json ]; then cat newsroom-data/image-report.json; else echo 'No image-report.json was generated.'; fi
          echo '=== VIDEO DIAGNOSTICS ==='
          if [ -f newsroom-data/video-report.json ]; then cat newsroom-data/video-report.json; else echo 'No video-report.json was generated.'; fi
      - name: Publish generated articles, images, videos and diagnostics
        run: |
          git config user.name 'C. O. Eric AI Newsroom'
          git config user.email 'actions@users.noreply.github.com'
          git add news/ newsroom-data/ videos/
          if git diff --cached --quiet; then
            echo 'No newsroom or Video Hub changes to publish.'
          else
            git commit -m 'AI newsroom: publish stories, images and videos'
            git fetch origin main
            # A human/other automation may update the same generated story while
            # this run is processing. During rebase, keep the current main version
            # for conflicts so an image/editorial fix is never overwritten.
            if ! git rebase origin/main; then
              conflicts="$(git diff --name-only --diff-filter=U || true)"
              if [ -n "$conflicts" ]; then
                echo "Rebase conflicts detected; preserving current main versions:"
                echo "$conflicts"
                git checkout --ours -- $conflicts
                git add $conflicts
                GIT_EDITOR=true git rebase --continue
              else
                git rebase --abort
                exit 1
              fi
            fi
            git push origin HEAD:main
          fi

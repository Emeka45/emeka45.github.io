name: C. O. Eric AI Newsroom

on:
  push:
    paths:
      - 'scripts/ai_newsroom.py'
      - '.github/workflows/ai-newsroom.yml'
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  newsroom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run newsroom
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/ai_newsroom.py
      - name: Show newsroom diagnostics
        if: always()
        run: |
          echo '=== NEWSROOM DIAGNOSTICS ==='
          if [ -f newsroom-data/run-report.json ]; then
            cat newsroom-data/run-report.json
          else
            echo 'No run-report.json was generated.'
          fi
          echo '=== GENERATED NEWS ==='
          find news -maxdepth 1 -type f -name '*.html' -print | sort || true
      - name: Publish generated articles and diagnostics
        run: |
          git config user.name 'C. O. Eric AI Newsroom'
          git config user.email 'actions@users.noreply.github.com'
          git add news/ newsroom-data/
          if git diff --cached --quiet; then
            echo 'No newsroom changes to publish.'
          else
            git commit -m 'AI newsroom: publish verified stories and diagnostics'
            git push
          fi

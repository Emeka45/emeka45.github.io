name: C. O. Eric AI Newsroom

# Verified newsroom + automatic Video Hub pipeline.
on:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/ai-newsroom.yml'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-newsroom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  newsroom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run reliable newsroom publisher
        run: python scripts/run_newsroom_reliable.py
      - name: Generate missing story images
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_news_images.py
      - name: Repair full article image paths
        run: python scripts/repair_news_images.py
      - name: Upgrade news SEO metadata
        run: python scripts/upgrade_news_seo.py
      - name: Update automatic Video Hub
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/update_video_hub.py
      - name: Show newsroom and video diagnostics
        if: always()
        run: |
          echo '=== NEWSROOM DIAGNOSTICS ==='
          if [ -f newsroom-data/run-report.json ]; then cat newsroom-data/run-report.json; else echo 'No run-report.json was generated.'; fi
          echo '=== IMAGE DIAGNOSTICS ==='
          if [ -f newsroom-data/image-report.json ]; then cat newsroom-data/image-report.json; else echo 'No image-report.json was generated.'; fi
          echo '=== VIDEO DIAGNOSTICS ==='
          if [ -f newsroom-data/video-report.json ]; then cat newsroom-data/video-report.json; else echo 'No video-report.json was generated.'; fi
      - name: Publish generated articles, images, videos and diagnostics
        run: |
          git config user.name 'C. O. Eric AI Newsroom'
          git config user.email 'actions@users.noreply.github.com'
          git add news/ newsroom-data/ videos/
          if git diff --cached --quiet; then
            echo 'No newsroom or Video Hub changes to publish.'
          else
            git commit -m 'AI newsroom: publish stories, images and videos'
            git fetch origin main
            if ! git rebase origin/main; then
              conflicts="$(git diff --name-only --diff-filter=U || true)"
              if [ -n "$conflicts" ]; then
                echo "Rebase conflicts detected; preserving current main versions:"
                echo "$conflicts"
                git checkout --ours -- $conflicts
                git add $conflicts
                GIT_EDITOR=true git rebase --continue
              else
                git rebase --abort
                exit 1
              fi
            fi
            git push origin HEAD:main
          fi

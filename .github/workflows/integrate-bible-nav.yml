name: Integrate Bible Hub Navigation

on:
  push:
    paths:
      - '.github/workflows/integrate-bible-nav.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v5

      - name: Add Bible Hub to desktop and mobile navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          desktop_old = '<a href="dictionary.html">📖 Dictionary</a><a href="jobs.html">💼 Jobs</a>'
          desktop_new = '<a href="dictionary.html">📖 Dictionary</a><a href="bible.html">📖 Bible Hub</a><a href="jobs.html">💼 Jobs</a>'

          mobile_old = '<a href="academic.html">🎓 Academic</a><a href="jobs.html">💼 Jobs</a>'
          mobile_new = '<a href="academic.html">🎓 Academic</a><a href="bible.html">📖 Bible Hub</a><a href="jobs.html">💼 Jobs</a>'

          changed = False
          if desktop_old in text and desktop_new not in text:
              text = text.replace(desktop_old, desktop_new, 1)
              changed = True

          if mobile_old in text and mobile_new not in text:
              text = text.replace(mobile_old, mobile_new, 1)
              changed = True

          if not changed:
              raise SystemExit('Bible Hub navigation is already integrated or the expected navigation markup was not found.')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit navigation update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Integrate Bible Hub into main navigation'
          git push

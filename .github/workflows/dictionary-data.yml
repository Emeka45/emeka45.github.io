name: Universal Dictionary data check

on:
  push:
    paths:
      - "dictionary.html"
      - "functions/api/dictionary.js"
      - ".github/workflows/dictionary-data.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  verify-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Open Dictionary source is reachable
        run: |
          python3 - <<'PY'
          import json, urllib.request
          url = "https://raw.githubusercontent.com/mhollingshead/open-dictionary/main/api/a/ab.json"
          with urllib.request.urlopen(url, timeout=30) as r:
              data = json.load(r)
          assert "ab" in data or any(k.startswith("ab") for k in data), "Unexpected dictionary shard format"
          print("Open Dictionary shard verified:", len(data), "entries")
          PY

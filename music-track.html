<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Song discovery page on C. O. Eric Music Hub."><title>Song — C. O. Eric Music</title><style>:root{--bg:#09070d;--text:#fffaff;--muted:#bdb4c8;--accent:#b16cff;--accent2:#ff8fcf;--line:rgba(255,255,255,.1);--max:900px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,rgba(177,108,255,.25),transparent 30%),linear-gradient(180deg,#09070d,#100b16 55%,#09070d);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.55}a{color:inherit;text-decoration:none}.wrap{width:min(var(--max),92%);margin:auto}.nav{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}.brand{font-weight:900}.mark{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));margin-right:8px}.hero{padding:60px 0}.art{display:grid;grid-template-columns:300px 1fr;gap:28px;align-items:center}.cover{aspect-ratio:1;border-radius:30px;display:grid;place-items:center;font-size:7rem;background:linear-gradient(135deg,#32184d,#161020 65%,#27152f);border:1px solid var(--line)}.eyebrow{color:#dfc7ff;font-size:.72rem;font-weight:900;letter-spacing:.1em}.hero h1{font-size:clamp(2.7rem,7vw,5.4rem);line-height:.95;letter-spacing:-.06em;margin:12px 0}.muted{color:var(--muted)}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:rgba(177,108,255,.15);color:#dfc7ff;font-size:.72rem;font-weight:900}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 15px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.045);color:#fff;font-weight:850}.primary{border:0;background:linear-gradient(135deg,var(--accent),var(--accent2))}.section{padding:30px 0;border-top:1px solid var(--line)}.notice{padding:20px;border:1px solid rgba(177,108,255,.25);border-radius:18px;background:rgba(177,108,255,.07);color:var(--muted)}.footer{padding:42px 0 60px;color:var(--muted)}.error{text-align:center;padding:90px 0}@media(max-width:700px){.art{grid-template-columns:1fr}.cover{max-width:300px}}</style></head><body><header class="wrap nav"><a class="brand" href="music.html"><span class="mark">U</span>C. O. Eric Music</a><a href="music-catalogue.html#songs">← Catalogue</a></header><main id="app" class="wrap"></main><footer class="wrap footer">© 2026 C. O. Eric · <a href="music.html">Music Hub</a> · <a href="music-submit.html">Submit Music</a></footer><script>const p=new URLSearchParams(location.search),title=p.get('title'),artist=p.get('artist'),app=document.getElementById('app');if(!title||!artist){app.innerHTML='<section class="error"><h1>Song not found</h1><p class="muted">Open a song from the Music Catalogue.</p><a class="btn primary" href="music-catalogue.html#songs">Browse songs</a></section>'}else{document.title=title+' — '+artist+' · C. O. Eric Music';const q=artist+' '+title,e=encodeURIComponent(q);app.innerHTML=`<section class="hero"><div class="art"><div class="cover">🎵</div><div><span class="eyebrow">SONG DISCOVERY</span><h1>${title}</h1><p><span class="badge">${artist}</span></p><p class="muted">Find this recording through official music services. This page stores discovery metadata only and does not host or reupload the audio.</p><div class="actions"><a class="btn primary" href="https://music.youtube.com/search?q=${e}" target="_blank" rel="noopener">▶ YouTube Music</a><a class="btn" href="https://open.spotify.com/search/${e}" target="_blank" rel="noopener">🟢 Spotify</a><a class="btn" href="https://music.apple.com/us/search?term=${e}" target="_blank" rel="noopener">🍎 Apple Music</a><a class="btn" href="https://audiomack.com/search?q=${e}" target="_blank" rel="noopener">🎧 Audiomack</a></div></div></div></section><section class="section"><div class="notice"><strong style="color:#fff">Official-source policy:</strong> C. O. Eric Music links listeners to legitimate platforms instead of copying commercial recordings. If you own or control this release and want richer metadata, artwork or an authorised player added, <a href="music-submit.html" style="color:#e1c8ff;font-weight:900">submit it for review</a>.</div></section>`}</script></body></html>

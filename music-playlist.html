<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Playlist — C. O. Eric Music Hub</title><style>body{margin:0;background:#090711;color:#fff;font-family:system-ui,sans-serif}.wrap{width:min(900px,92%);margin:auto}header{padding:20px 0;border-bottom:1px solid #282331}a{color:#d8baff}.hero{padding:45px 0}.card{padding:20px;margin:12px 0;border:1px solid #282331;border-radius:17px;background:#110d18}.btn{padding:10px 14px;border:0;border-radius:10px;background:#9b6cff;color:#fff;font-weight:800}.muted{color:#b8adbf}audio{width:100%;margin-top:12px}</style></head><body><header><div class="wrap"><a href="music.html">← Music Hub</a></div></header><main class="wrap"><section class="hero"><span>PLAYLIST</span><h1 id="title">Playlist</h1><p id="description" class="muted">Curated music.</p><button id="play" class="btn">▶ Play all</button></section><section id="tracks"></section><div id="player" class="card" style="display:none"><strong id="now"></strong><audio id="audio" controls></audio></div></main><script>const p=new URLSearchParams(location.search);const title=p.get('title')||'Playlist';document.getElementById('title').textContent=title;const tracks=[];const box=document.getElementById('tracks');box.innerHTML=tracks.length?tracks.map((t,i)=>`<div class="card"><strong>${t.title}</strong><p class="muted">${t.artist}</p><button class="btn" onclick="play(${i})">Play</button></div>`).join(''):'<div class="card muted">No tracks have been published in this playlist yet.</div>';function play(i){const t=tracks[i];if(!t)return;document.getElementById('player').style.display='block';document.getElementById('now').textContent=t.title+' — '+t.artist;document.getElementById('audio').src=t.audio;document.getElementById('audio').play().catch(()=>{})}document.getElementById('play').onclick=()=>tracks[0]&&play(0);</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="C. O. Eric Games Hub — lightweight mobile browser games."><meta name="theme-color" content="#08060f"><title>Games Hub — C. O. Eric</title><style>body{margin:0;background:radial-gradient(circle at 85% 0%,#7c3aed44,transparent 35%),#08060f;color:#faf8ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{width:min(1100px,92%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0}.back,.btn{border:1px solid #ffffff1c;border-radius:11px;background:#ffffff0a;color:#fff;padding:10px 14px;font-weight:750;text-decoration:none;cursor:pointer}.primary{background:linear-gradient(135deg,#9b6cff,#d19cff);border:0}.hero{padding:40px 0 20px}.hero h1{font-size:clamp(2.7rem,9vw,5.4rem);line-height:.92;margin:12px 0;letter-spacing:-.06em}.gradient{background:linear-gradient(105deg,#fff,#d8b4ff,#9b6cff);-webkit-background-clip:text;color:transparent}.muted{color:#b9b2c9}.search{width:100%;box-sizing:border-box;padding:13px;border-radius:12px;border:1px solid #ffffff1c;background:#ffffff0a;color:#fff;font:inherit;margin:18px 0}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.chips .btn{white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{display:flex;flex-direction:column;background:#ffffff08;border:1px solid #ffffff14;border-radius:20px;padding:20px;min-height:190px}.icon{font-size:2.2rem}.card h2{font-size:1.2rem;margin:7px 0}.card p{color:#b9b2c9;font-size:.9rem;flex:1}.meta{font-size:.72rem;color:#d8c7ff;text-transform:uppercase;font-weight:800;letter-spacing:.07em}.section{margin:30px 0 12px}.empty{grid-column:1/-1;text-align:center;padding:30px;border:1px dashed #ffffff20;border-radius:16px;color:#b9b2c9}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header class="top"><a class="back" href="index.html">← C. O. Eric</a><b>🎮 Games</b></header><section class="hero"><span class="meta">C. O. Eric Arcade</span><h1>Play something <span class="gradient">fun.</span></h1><p class="muted">Lightweight games for phones, tablets and desktops. No account required.</p><input id="q" class="search" placeholder="Search games…" aria-label="Search games"><div id="chips" class="chips"></div></section><div class="section"><h2>Featured Games</h2><div id="featured" class="grid"></div></div><div class="section"><h2 id="count">All Games</h2><div id="games" class="grid"></div></div></div><script>const S={a:[],c:'All',q:''},E=(s)=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),card=g=>`<article class="card"><div class="icon">${E(g.icon)}</div><span class="meta">${E(g.category)}</span><h2>${E(g.title)}</h2><p>${E(g.description)}</p><a class="btn primary" href="${E(g.path)}">Play Now →</a></article>`,render=()=>{let f=S.a.filter(g=>S.c==='All'||g.category===S.c).filter(g=>!S.q||`${g.title} ${g.description} ${g.category}`.toLowerCase().includes(S.q.toLowerCase()));games.innerHTML=f.length?f.map(card).join(''):'<div class="empty">No games match your search.</div>';count.textContent=`All Games · ${f.length}`;featured.innerHTML=S.a.filter(g=>g.featured).map(card).join('')};fetch('games/registry.json').then(r=>r.json()).then(a=>{S.a=a;let cats=['All',...new Set(a.map(g=>g.category))];chips.innerHTML=cats.map(c=>`<button class="btn ${c==='All'?'primary':''}">${E(c)}</button>`).join('');chips.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{S.c=cats[i];chips.querySelectorAll('button').forEach(x=>x.classList.toggle('primary',x===b));render()});q.oninput=e=>{S.q=e.target.value;render()};render()}).catch(()=>games.innerHTML='<div class="empty">Catalogue unavailable. Please refresh.</div>');</script></body></html>
